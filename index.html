<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="description" content="Dong's closet — daily outfits, wardrobe etiquette, and wear history for Guimarães." />
    <link rel="icon" href="favicon.ico" />
    <title>Closet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="dong-ui/theme.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="dong-ui/theme.js"></script>
  </head>
  <body>
    <header class="dong-topbar nav-glass">
      <div class="brand">
        <p class="eyebrow" id="city-label">Guimarães</p>
        <h1>Closet</h1>
      </div>
      <div class="top-actions">
        <button type="button" class="ui-btn ui-btn-ghost sync-btn" data-action="open-sync">Sync</button>
        <a class="dong-home-link" href="https://dong-xuyong.github.io/" aria-label="Home">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z" />
          </svg>
        </a>
        <button type="button" data-dong-theme-toggle aria-label="Toggle color theme"></button>
      </div>
    </header>
    <nav class="tabbar" aria-label="Closet">
      <button type="button" data-action="view" data-view="today" aria-current="page">Today</button>
      <button type="button" data-action="view" data-view="closet">Closet</button>
      <button type="button" data-action="view" data-view="history">History</button>
    </nav>
    <main id="app"></main>
    <div id="sheet-root"></div>
    <p id="toast" class="toast" role="status" hidden></p>
    <script src="dong-ui/gh-sync.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
